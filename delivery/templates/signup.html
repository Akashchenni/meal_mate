{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Meal Mate</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body class="auth-page">

    <div class="auth-card signup-card">

        <div class="auth-logo">
            🍴
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join Meal Mate and discover great food
        </p>


        <form method="post" action="{% url 'signup' %}">

            {% csrf_token %}


            <div class="input-group">

                <label for="username">
                    Name
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>


            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="input-group">

                <label for="mobile">
                    Mobile
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter your mobile number"
                    required>

            </div>


            <div class="input-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                    required></textarea>

            </div>


            <button type="submit" class="auth-btn">
                CREATE ACCOUNT
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="/open_signin/">
                Sign In
            </a>

        </p>


        <a href="/" class="back-link">
            ← Back to Home
        </a>

    </div>

</body>

</html>
