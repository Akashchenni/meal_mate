{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Mate - Customer</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

        <div class="restaurant-table-wrapper">

            <table class="restaurant-table">

                <thead>

                    <tr>

                        <th>Picture</th>

                        <th>Name</th>

                        <th>Cuisine</th>

                        <th>Rating</th>

                        <th>Operations</th>

                    </tr>

                </thead>


                <tbody>

                    {% for restaurant in restaurants %}

                    <tr>

                        <!-- Picture -->

                        <td>

                            {% if restaurant.picture %}

                            <img
                                src="{{ restaurant.picture }}"
                                alt="Picture of {{ restaurant.name }}"
                                class="restaurant-image">

                            {% else %}

                            <div class="no-image">
                                🍽️
                            </div>

                            {% endif %}

                        </td>


                        <!-- Name -->

                        <td>

                            <div class="restaurant-name">

                                {{ restaurant.name }}

                            </div>

                        </td>


                        <!-- Cuisine -->

                        <td>

                            <span class="cuisine-badge">

                                {{ restaurant.cuisine }}

                            </span>

                        </td>


                        <!-- Rating -->

                        <td>

                            <div class="rating">

                                ⭐ {{ restaurant.rating }}

                            </div>

                        </td>


                        <!-- Operations -->

                        <td>

                            <div class="restaurant-actions">


                                <a href="{% url 'view_menu' restaurant.id username  %}" class="action-btn menu-btn">
                                    🍔 View-Menu
                                </a>

                            </div>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>
    
</body>


</html>
