<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {{username}}
    <table border="3">
        <thead>
            <th>Item Image</th>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
        </thead>
    
    <tbody>
        {% for item in itemlist%}
        <tr>
            <td>
                <img src="{{item.picture}}" alt="">
            </td>
            <td>{{item.name}}</td>
            <td>{{item.description}}</td>
            <td>{{item.price}}</td>
        </tr>
        {% endfor %}
    </tbody>
    </table>
    <h1>Total Price" : {{total_price}}</h1>

    <form action="{% url 'checkout' username%}">
        <input type="submit" name="username" value="CHECK OUT">
    </form>

</body>
</html>
