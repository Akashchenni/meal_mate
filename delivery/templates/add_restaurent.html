<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Restaurant - Meal Mate</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body class="auth-page">

    <div class="auth-card restaurant-form-card">

        <!-- Logo -->

        <div class="auth-logo">
            🍽️
        </div>

        <h1>Add Restaurant</h1>

        <p class="auth-subtitle">
            Add a new restaurant to Meal Mate
        </p>


        <!-- FORM -->

        <form method="post" action="{% url 'add_restaurent' %}">

            {% csrf_token %}


            <!-- Restaurant Name -->

            <div class="input-group">

                <label for="name">
                    Restaurant Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter restaurant name"
                    required>

            </div>


            <!-- Picture -->

            <div class="input-group">

                <label for="picture">
                    Picture URL
                </label>

                <input
                    type="url"
                    id="picture"
                    name="picture"
                    placeholder="https://example.com/restaurant.jpg">

            </div>


            <!-- Cuisine -->

            <div class="input-group">

                <label for="cuisine">
                    Cuisine
                </label>

                <input
                    type="text"
                    id="cuisine"
                    name="cuisine"
                    placeholder="Eg. Indian, Chinese, Italian"
                    required>

            </div>


            <!-- Rating -->

            <div class="input-group">

                <label for="rating">
                    Rating
                </label>

                <input
                    type="number"
                    id="rating"
                    name="rating"
                    placeholder="Enter rating (0 - 5)"
                    step="0.1"
                    min="0"
                    max="5"
                    required>

            </div>


            <!-- Button -->

            <button
                type="submit"
                class="auth-btn">

                ADD RESTAURANT

            </button>

        </form>


        <!-- Back -->

        <a href="/signin/" class="back-link">
            ← Back
        </a>

    </div>

</body>

</html>
