{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Mate</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body class="welcome-page">

    <div class="welcome-card">

        <div class="welcome-logo">
            🍴
        </div>

        <h1>Welcome to <span>Meal Mate</span>!</h1>

        <p class="welcome-text">
            Discover delicious food, explore restaurants
            and enjoy your favorite meals.
        </p>

        <div class="welcome-buttons">

            <a href="open_signin/" class="btn btn-primary">
                Sign In
            </a>

            <a href="open_signup/" class="btn btn-secondary">
                Sign Up
            </a>

        </div>

    </div>

</body>
</html>
